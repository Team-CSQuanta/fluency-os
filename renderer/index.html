<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' blob:; media-src 'self' blob:; connect-src http://127.0.0.1:*"
    />
    <!-- Fonts are bundled, not fetched. They used to come from Google Fonts,
         which meant an app whose own header reads "nothing leaves the machine"
         made a third-party request on every launch, and fell back to whatever
         system-ui resolved to whenever the machine was offline. 148KB buys
         both the privacy claim and a stable rendering. -->
    <link rel="icon" type="image/png" href="/icon.png" />
    <title>FluencyOS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
