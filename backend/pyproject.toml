[project]
name = "fluencyos-backend"
version = "0.1.0"
description = "FluencyOS FastAPI backend"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.4",
    "ebooklib>=0.20",
    "lxml>=6.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
